# Windows XP -- cmd.exe. Identical in all five XP themes (their terminal
# palettes are the same; only colors.toml's accent differs).
#
# ~/.config/foot/foot.ini includes this file LAST, so every key here overrides
# the user's own. It replaces the template-generated foot.ini, so it carries
# the full palette the template would have produced from colors.toml.
[main]
# Lucida Console. The sizes below are only the starting value: `xp-mode sizes`
# rewrites them in the live copy (~/.local/state/omarchy/current/theme/foot.ini)
# to round(pt x 13/12), where pt is the size in ~/.config/foot/foot.ini that
# `omarchy display text size` sets (Omarchy default 9 -> 10, 12 -> 13). Lucida
# needs the extra 13/12 to match JetBrainsMono's x-height at the same pt.
# JetBrainsMono NF at the same size is the fallback, so Nerd glyphs, braille
# (btop) and powerline (tmux) never fall to tofu.
font=Lucida Console:size=13,JetBrainsMono Nerd Font:size=13
# cmd.exe text starts at the frame edge, not in a centred 16px margin.
pad=2x2
# Only the title changes; app-id stays `foot`, which is what every window rule
# matches (no rule in hypr/ or Omarchy's defaults matches a terminal by title).
title=C:\WINDOWS\system32\cmd.exe
# Locked, or /etc/bash.bashrc's PROMPT_COMMAND (user@host:dir) and tmux's
# set-titles replace it at the first prompt.
locked-title=yes

[cursor]
# cmd.exe: blinking underscore (25% "small" cursor) at the Windows caret rate,
# hidden while the window is unfocused.
style=underline
blink=yes
blink-rate=530
underline-thickness=3px
unfocused-style=none

[colors-dark]
# cmd.exe is opaque. alpha-mode stays `matching` (see the history of
# foot/foot.ini) so a translucent override would still cover tmux cells.
alpha=1.0
alpha-mode=matching

foreground=C0C0C0
background=000000
selection-foreground=000000
selection-background=C0C0C0

cursor=000000 FFFFFF

regular0=000000
regular1=800000
regular2=008000
regular3=808000
regular4=000080
regular5=800080
regular6=008080
regular7=C0C0C0

bright0=808080
bright1=FF0000
bright2=00FF00
bright3=FFFF00
bright4=0000FF
bright5=FF00FF
bright6=00FFFF
bright7=FFFFFF
