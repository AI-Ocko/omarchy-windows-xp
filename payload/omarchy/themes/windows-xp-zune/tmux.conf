# Windows XP status bar for tmux -- Zune. Identical layout in all five XP
# themes; only the colours differ.
#
# Sourced LAST by ~/.config/tmux/tmux.conf (from the active theme dir) and
# pushed into an already-running server by omarchy/xp/bin/xp-mode. Sets ONLY
# options tmux.conf also sets, so re-sourcing tmux.conf (what `xp-mode off`
# does) puts every one of them back.
#
# Colours: NORMALDEFAULT_INI [SysMetrics] Btnface #E2E2E2, BtnShadow
# #B4B4B4, BtnHighlight #FFFFFF, Highlight #BEBEBE / HighlightText #000000;
# messages use the XP tooltip InfoWindow #FFFFE1 / InfoText #000000.
# A sunken panel is drawn as ▏text▕: shadow edge left, highlight edge right.

# XP status bars sit at the bottom of the window.
set -g status-position bottom
set -g status-style "bg=#E2E2E2,fg=#000000"

set -g status-left "#[fg=#B4B4B4]▏#[fg=#000000] #S #[fg=#FFFFFF]▕ "

# Prefix / copy-mode / zoom flags as their own panels, then the host.
set -g status-right "#{?client_prefix,#[fg=#B4B4B4]▏#[fg=#000000] PREFIX #[fg=#FFFFFF]▕ ,}#{?pane_in_mode,#[fg=#B4B4B4]▏#[fg=#000000] COPY #[fg=#FFFFFF]▕ ,}#{?window_zoomed_flag,#[fg=#B4B4B4]▏#[fg=#000000] ZOOM #[fg=#FFFFFF]▕ ,}#[fg=#B4B4B4]▏#[fg=#000000] #h #[fg=#FFFFFF]▕"

# The current window is a selected item (Highlight), the rest plain panels.
set -g window-status-format "#[fg=#B4B4B4]▏#[fg=#000000] #I:#W #[fg=#FFFFFF]▕"
set -g window-status-current-format "#[fg=#B4B4B4]▏#[bg=#BEBEBE,fg=#000000] #I:#W #[bg=#E2E2E2,fg=#FFFFFF]▕"
set -g window-status-bell-style "fg=#800000,bold"

set -g pane-border-style "fg=#B4B4B4"
set -g pane-active-border-style "fg=#E2E2E2"
set -g pane-border-lines single

set -g message-style "bg=#FFFFE1,fg=#000000"
set -g message-command-style "bg=#FFFFE1,fg=#000000"
# Copy mode is cmd.exe's Mark: inverted grey block.
set -g mode-style "bg=#C0C0C0,fg=#000000"
set -g copy-mode-match-style "bg=#808080,fg=#000000"
set -g copy-mode-current-match-style "bg=#BEBEBE,fg=#000000"
setw -g clock-mode-colour "#C0C0C0"
